<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="韓文學習">
  <title>韓文學習</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
  <div id="update" class="update hidden">有新版本 <button class="btn primary" onclick="location.reload()">重新載入</button></div>
  <script>
    // A new service worker taking over means fresh files were cached: offer a reload.
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController) document.getElementById('update').classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
